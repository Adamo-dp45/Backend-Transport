# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.entity.path: '%kernel.project_dir%/src/Entity'
    glide.key: '%env(GLIDE_KEY)%'
    # Où Glide lit les originaux et range ses vignettes. Paramétré pour que les TESTS le fassent lire leurs
    # propres fichiers (cf. 'when@test' plus bas), jamais 'public/'.
    glide.source: '%kernel.project_dir%/public'
    glide.cache: '%kernel.project_dir%/public/images/cache'
    app.mailer.email: '%env(MAILER_FROM_EMAIL)%'
    app.mailer.name: '%env(MAILER_FROM_NAME)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            # Les fixtures étendent des classes de 'doctrine/doctrine-fixtures-bundle', qui est en
            # Exclues du chargement AUTOMATIQUE, mais déclarées juste après pour TOUS les
            # environnements : elles ont besoin de l'autowiring, et le bloc dédié plus bas y ajoute
            # le purger décoré. (Le bundle est passé en dépendance de PRODUCTION le 30/09/2026 :
            # l'installation d'une nouvelle compagnie se fait par les fixtures.)
            - '../src/DataFixtures/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Fixtures — disponibles dans TOUS les environnements depuis le 30/09/2026 --
    #
    # Le bundle est passé de 'require-dev' à 'require' : l'installation d'une nouvelle compagnie
    # passe par les fixtures, et 'composer install --no-dev' les rendait introuvables en production.
    # Elles ne sont donc plus déclarées sous 'when@dev' / 'when@test'.
    #
    # !! 'doctrine:fixtures:load' PURGE LA BASE avant de charger. En production, ne l'employer que
    # sur une installation NEUVE, ou avec '--append'. La commande demande confirmation, mais
    # '--no-interaction' passe outre — c'est justement le drapeau qu'un script de déploiement met
    # par réflexe.
    App\DataFixtures\:
        resource: '../src/DataFixtures/'

    # Purger tolérant au cycle 'ticket' <-> 'reservation'. En décorant la fabrique du bundle,
    # l'alias « default » suit le décorateur : 'doctrine:fixtures:load' recharge la base sans
    # aucune option supplémentaire.
    App\DataFixtures\Purger\PurgerSansContrainteFactory:
        decorates: 'doctrine.fixtures.purger.orm_purger_factory'
        arguments: ['@.inner']
    # --

    # OpenApi --
    App\ApiPlatform\OpenApi\OpenApiFactory:
        decorates: 'api_platform.openapi.factory' # On décore la class 'OpenApiFactory'
        arguments: ['@App\ApiPlatform\OpenApi\OpenApiFactory.inner']
        autoconfigure: false
    # -- On va ensuite utiliser mon 'OpenApiFactory' lorsque les spécifications 'OpenApi' vont être générerés

    # Processor & Provider --
    _instanceof:
        ApiPlatform\State\ProcessorInterface:
            bind:
                $processor: '@api_platform.doctrine.orm.state.persist_processor'
                # $removeProcessor: '@ApiPlatform\Doctrine\Common\State\RemoveProcessor' -- 'o'

        # ApiPlatform\State\ProviderInterface: -- Pour le provider si on a en besoin
        #    bind:
        #        $provider: '@api_platform.doctrine.orm.state.item_provider'

    # App\State\: -- Va bind sur tous les class dans 'State\' donc trop générique
    #    resource: '../src/State/'
    #    bind:
    #        $processor: '@api_platform.doctrine.orm.state.persist_processor'

    # App\State\EntrepriseInjectionProcessor: -- Ou.. le faire un à un
    #    bind:
    #        $processor: '@api_platform.doctrine.orm.state.persist_processor'
    ## --

    App\Domain\Service\EntityDiscoveryService:
        arguments:
            $entityPath: '%app.entity.path%'

    App\Domain\Service\CorbeilleRegistry:
        arguments:
            $entityPath: '%app.entity.path%'

    # Extension.. mais pas utile à cause de l'autoconfigure --
    # services:
    #    App\Doctrine\EntrepriseScopeExtension:
    #        tags:
    #            - { name: 'api_platform.doctrine.orm.query_extension.collection' }
    #            - { name: 'api_platform.doctrine.orm.query_extension.item' }
    # --

when@test:
    # Glide lit les images téléversées PAR LES TESTS ('when@test' de 'vich_uploader.yaml'), jamais 'public/'.
    parameters:
        glide.source: '%kernel.project_dir%/var/test'
        glide.cache: '%kernel.project_dir%/var/test/cache'
